<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="st-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#131c2e" stroke-width="0.75" opacity="0.6" />
      <circle cx="22" cy="0" r="1.1" fill="#22d3ee" opacity="0.25" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="st-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="st-glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .st-font {
        font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', 'Liberation Mono', monospace;
      }

      /* Flame and Glow Pulse */
      @keyframes flameDance {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #22d3ee); }
        50% { transform: scale(1.15) translateY(-2px); filter: drop-shadow(0 0 10px #22d3ee); }
      }
      @keyframes flameInnerFlicker {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.5; }
      }
      .flame-core {
        transform-origin: 35px 35px;
        animation: flameDance 2s ease-in-out infinite;
      }
      .flame-flicker {
        animation: flameInnerFlicker 1.2s ease-in-out infinite;
      }

      /* Rotating Plasma Ring */
      @keyframes plasmaRingSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes plasmaRingReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      .ring-spin-cw {
        transform-origin: 35px 35px;
        animation: plasmaRingSpin 8s linear infinite;
      }
      .ring-spin-ccw {
        transform-origin: 35px 35px;
        animation: plasmaRingReverse 6s linear infinite;
      }

      /* Number Glow Pulse */
      @keyframes numberGlow {
        0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 2px #22d3ee); }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #22d3ee); }
      }
      .num-cyan-pulse {
        animation: numberGlow 2.5s ease-in-out infinite;
      }

      /* Beacon Blink */
      @keyframes beaconBlinkSt {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #22d3ee); }
        50% { opacity: 0.3; }
      }
      .beacon-st {
        animation: beaconBlinkSt 1.3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="900" height="200" rx="14" fill="#060911" stroke="#1e293b" stroke-width="1.6" />
  <rect x="12" y="12" width="896" height="196" rx="12" fill="url(#st-grid)" />

  <!-- Corner Brackets -->
  <path d="M 16 30 L 16 16 L 30 16" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 904 30 L 904 16 L 890 16" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 16 190 L 16 204 L 30 204" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 904 190 L 904 204 L 890 204" fill="none" stroke="#22d3ee" stroke-width="2.2" />

  <!-- ==================== 3 CYBER METRIC CARDS ==================== -->

  <!-- CARD 1: CURRENT STREAK (Left) -->
  <g transform="translate(30, 26)">
    <rect x="0" y="0" width="270" height="168" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" />
    <rect x="0" y="0" width="4" height="168" rx="2" fill="#22d3ee" />

    <!-- Top Badge -->
    <rect x="16" y="14" width="160" height="20" rx="4" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-width="0.8" />
    <text x="96" y="28" fill="#22d3ee" font-size="9" font-weight="700" text-anchor="middle" class="st-font">CURRENT STREAK // ACTIVE</text>

    <!-- Left: Animated Cyber Plasma Flame & Ring -->
    <g transform="translate(18, 52)">
      <!-- Outer Rotating Orbit Ring -->
      <circle cx="35" cy="35" r="28" fill="none" stroke="#162032" stroke-width="3" />
      <circle cx="35" cy="35" r="28" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="40 20" class="ring-spin-cw" filter="url(#st-glow-cyan)" />

      <!-- Center Animated Cyber Flame -->
      <g class="flame-core">
        <path d="M 35 18 C 39 25, 47 30, 47 40 C 47 48, 41 53, 35 53 C 29 53, 23 48, 23 40 C 23 32, 29 27, 35 18 Z" fill="#22d3ee" />
        <path d="M 35 26 C 38 31, 42 35, 42 42 C 42 46, 38 49, 35 49 C 32 49, 28 46, 28 42 C 28 36, 32 32, 35 26 Z" fill="#ffffff" class="flame-flicker" />
      </g>
    </g>

    <!-- Right: Big Bold Metric Number: 2 -->
    <g transform="translate(105, 52)">
      <text x="20" y="44" fill="#22d3ee" font-size="44" font-weight="800" class="st-font num-cyan-pulse">2</text>
      <text x="20" y="66" fill="#cbd5e1" font-size="11" font-weight="700" class="st-font">DAYS STREAK</text>
    </g>

    <!-- Bottom Status Line -->
    <line x1="16" y1="135" x2="254" y2="135" stroke="#1e293b" stroke-width="1" />
    <circle cx="24" cy="150" r="3" fill="#22d3ee" class="beacon-st" />
    <text x="34" y="153" fill="#38bdf8" font-size="8.5" font-weight="600" class="st-font">COHERENCE MAINTAINED</text>
  </g>

  <!-- CARD 2: TOTAL CONTRIBUTIONS (Center) -->
  <g transform="translate(325, 26)">
    <rect x="0" y="0" width="270" height="168" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" />
    <rect x="0" y="0" width="4" height="168" rx="2" fill="#818cf8" />

    <!-- Top Badge -->
    <rect x="16" y="14" width="175" height="20" rx="4" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-width="0.8" />
    <text x="103" y="28" fill="#a78bfa" font-size="9" font-weight="700" text-anchor="middle" class="st-font">CUMULATIVE CONTRIBUTIONS</text>

    <!-- Left: Dual Concentric Rotating Benchmark Arc -->
    <g transform="translate(18, 52)">
      <circle cx="35" cy="35" r="30" fill="none" stroke="#191530" stroke-width="3.5" />
      <!-- Outer Arc Spin -->
      <circle cx="35" cy="35" r="30" fill="none" stroke="#818cf8" stroke-width="3.5" stroke-dasharray="75 40" class="ring-spin-cw" filter="url(#st-glow-purple)" />
      <!-- Inner Arc Reverse Spin -->
      <circle cx="35" cy="35" r="22" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="50 30" class="ring-spin-ccw" />
      <circle cx="35" cy="35" r="5" fill="#818cf8" class="beacon-st" />
    </g>

    <!-- Right: Big Bold Metric Number: 351 -->
    <g transform="translate(95, 52)">
      <text x="20" y="44" fill="#ffffff" font-size="44" font-weight="800" class="st-font">351</text>
      <text x="20" y="66" fill="#cbd5e1" font-size="11" font-weight="700" class="st-font">TOTAL COMMITS</text>
    </g>

    <!-- Bottom Status Line -->
    <line x1="16" y1="135" x2="254" y2="135" stroke="#1e293b" stroke-width="1" />
    <circle cx="24" cy="150" r="3" fill="#818cf8" class="beacon-st" />
    <text x="34" y="153" fill="#a78bfa" font-size="8.5" font-weight="600" class="st-font">APR 4, 2024 – PRESENT</text>
  </g>

  <!-- CARD 3: LONGEST STREAK RECORD (Right) -->
  <g transform="translate(620, 26)">
    <rect x="0" y="0" width="270" height="168" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" />
    <rect x="0" y="0" width="4" height="168" rx="2" fill="#38bdf8" />

    <!-- Top Badge -->
    <rect x="16" y="14" width="160" height="20" rx="4" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="0.8" />
    <text x="96" y="28" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle" class="st-font">HISTORICAL CADENCE</text>

    <!-- Left: Rotating Reticle & Crosshairs -->
    <g transform="translate(18, 52)">
      <circle cx="35" cy="35" r="28" fill="none" stroke="#102538" stroke-width="2.5" />
      <circle cx="35" cy="35" r="28" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="30 25" class="ring-spin-cw" />
      <line x1="35" y1="12" x2="35" y2="58" stroke="#1e3a5f" stroke-width="1.2" />
      <line x1="12" y1="35" x2="58" y2="35" stroke="#1e3a5f" stroke-width="1.2" />
      <circle cx="35" cy="35" r="4" fill="#38bdf8" class="beacon-st" />
    </g>

    <!-- Right: Metric Title -->
    <g transform="translate(95, 52)">
      <text x="20" y="44" fill="#38bdf8" font-size="34" font-weight="800" class="st-font">ACTIVE</text>
      <text x="20" y="66" fill="#cbd5e1" font-size="11" font-weight="700" class="st-font">STREAK RECORD</text>
    </g>

    <!-- Bottom Status Line -->
    <line x1="16" y1="135" x2="254" y2="135" stroke="#1e293b" stroke-width="1" />
    <circle cx="24" cy="150" r="3" fill="#38bdf8" class="beacon-st" />
    <text x="34" y="153" fill="#38bdf8" font-size="8.5" font-weight="600" class="st-font">CONTINUOUS HARVEST ➔</text>
  </g>
</svg>
