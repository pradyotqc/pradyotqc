<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="hdr-grid-v4" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#131d2f" stroke-width="0.75" opacity="0.6" />
      <circle cx="28" cy="0" r="1" fill="#00f5d4" opacity="0.3" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shimmer-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Shimmer Linear Gradient for Title -->
    <linearGradient id="shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="35%" stop-color="#00e5ff" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <style>
      /* 3D Gyroscope Rotations */
      @keyframes spinOrbital1 {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinOrbital2 {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes spinOrbital3 {
        from { transform: rotate(45deg); }
        to { transform: rotate(405deg); }
      }
      @keyframes nucleusBreathe {
        0%, 100% { r: 7px; opacity: 0.85; filter: drop-shadow(0 0 4px #00f5d4); }
        50% { r: 10px; opacity: 1; filter: drop-shadow(0 0 14px #00f5d4) drop-shadow(0 0 22px #a855f7); }
      }
      @keyframes titleBreathe {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(0, 245, 212, 0.4)); }
        50% { filter: drop-shadow(0 0 14px rgba(0, 245, 212, 0.85)) drop-shadow(0 0 25px rgba(168, 85, 247, 0.6)); }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }

      .hdr-font { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .gyro-ring1 { transform-origin: 790px 110px; animation: spinOrbital1 10s linear infinite; }
      .gyro-ring2 { transform-origin: 790px 110px; animation: spinOrbital2 14s linear infinite; }
      .gyro-ring3 { transform-origin: 790px 110px; animation: spinOrbital3 8s linear infinite; }
      .nucleus-dot { transform-origin: 790px 110px; animation: nucleusBreathe 3s ease-in-out infinite; }
      .title-glow { animation: titleBreathe 4s ease-in-out infinite; }
      .beacon { animation: beaconBlink 1.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container Box (Solid clean frame, NO crawling dashes!) -->
  <rect x="10" y="10" width="900" height="200" rx="16" fill="#070a14" stroke="#1f2b3e" stroke-width="1.8" />
  <rect x="12" y="12" width="896" height="196" rx="14" fill="url(#hdr-grid-v4)" />

  <!-- Corner Brackets -->
  <path d="M 16 36 L 16 16 L 36 16" fill="none" stroke="#00f5d4" stroke-width="2.5" />
  <path d="M 904 36 L 904 16 L 884 16" fill="none" stroke="#00f5d4" stroke-width="2.5" />
  <path d="M 16 184 L 16 204 L 36 204" fill="none" stroke="#00f5d4" stroke-width="2.5" />
  <path d="M 904 184 L 904 204 L 884 204" fill="none" stroke="#00f5d4" stroke-width="2.5" />

  <!-- Left Side: Typography & Metadata -->
  <g transform="translate(42, 42)">
    <!-- Status Beacon -->
    <circle cx="8" cy="8" r="4.5" fill="#00f5d4" class="beacon" filter="url(#shimmer-glow)" />
    <text x="24" y="12" fill="#00f5d4" font-size="11" font-weight="700" letter-spacing="1.5" class="hdr-font">
      QUANTUM COMPUTATION KERNEL // REAL-TIME COHERENCE
    </text>

    <!-- Prominent Glowing Title -->
    <text x="0" y="58" fill="url(#shimmer-grad)" font-size="38" font-weight="900" letter-spacing="2" class="hdr-font title-glow">
      PRADYOT PRITAM SAHOO
    </text>

    <!-- Subtitle -->
    <text x="0" y="94" fill="#e2e8f0" font-size="13" font-weight="600" letter-spacing="1" class="hdr-font">
      [ QUANTUM COMPUTING RESEARCHER • ALGORITHM–HARDWARE CO-DESIGN ]
    </text>

    <!-- Research Pillars Tagline -->
    <text x="0" y="124" fill="#64748b" font-size="11.5" font-weight="500" letter-spacing="0.8" class="hdr-font">
      FAULT-TOLERANT ARCHITECTURES • PULSE TRANSPILATION • TENSOR NETWORKS
    </text>
  </g>

  <!-- Right Side: 3D Animated Quantum Gyroscope / Atomic Core -->
  <g id="quantum-gyro">
    <!-- Center Radiant Nucleus -->
    <circle cx="790" cy="110" r="8" fill="#00f5d4" class="nucleus-dot" filter="url(#core-glow)" />
    <circle cx="790" cy="110" r="3" fill="#ffffff" />

    <!-- Orbital Ring 1 (Cyan) -->
    <g class="gyro-ring1">
      <ellipse cx="790" cy="110" rx="65" ry="24" fill="none" stroke="#00f5d4" stroke-width="1.8" stroke-dasharray="8 5" opacity="0.85" />
      <circle cx="855" cy="110" r="4" fill="#00f5d4" filter="url(#shimmer-glow)" />
    </g>

    <!-- Orbital Ring 2 (Sky Blue) -->
    <g class="gyro-ring2">
      <ellipse cx="790" cy="110" rx="65" ry="24" fill="none" stroke="#00e5ff" stroke-width="1.6" stroke-dasharray="10 6" opacity="0.75" />
      <circle cx="725" cy="110" r="3.5" fill="#00e5ff" filter="url(#shimmer-glow)" />
    </g>

    <!-- Orbital Ring 3 (Violet) -->
    <g class="gyro-ring3">
      <ellipse cx="790" cy="110" rx="55" ry="20" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7" />
      <circle cx="790" cy="90" r="3" fill="#a855f7" filter="url(#shimmer-glow)" />
    </g>

    <!-- HUD Crosshair Reticle -->
    <line x1="790" y1="35" x2="790" y2="45" stroke="#1e293b" stroke-width="1.2" />
    <line x1="790" y1="175" x2="790" y2="185" stroke="#1e293b" stroke-width="1.2" />
    <line x1="715" y1="110" x2="725" y2="110" stroke="#1e293b" stroke-width="1.2" />
    <line x1="855" y1="110" x2="865" y2="110" stroke="#1e293b" stroke-width="1.2" />
  </g>
</svg>
