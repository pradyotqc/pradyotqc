<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="qc-grid-v4" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#141c2c" stroke-width="0.75" opacity="0.6" />
      <circle cx="24" cy="0" r="1" fill="#00f5d4" opacity="0.25" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="qc-glow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="qc-glow-v" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* Rotating Qubit Phase Dials */
      @keyframes phaseSpin0 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes phaseSpin1 { from { transform: rotate(45deg); } to { transform: rotate(405deg); } }
      @keyframes phaseSpin2 { from { transform: rotate(90deg); } to { transform: rotate(450deg); } }
      @keyframes phaseSpin3 { from { transform: rotate(180deg); } to { transform: rotate(540deg); } }

      /* Wavepacket Propagation across Qubit 0 (4.5s cycle) */
      @keyframes packetRun0 {
        0% { cx: 55px; opacity: 0; }
        10% { opacity: 1; }
        25% { cx: 96px; }  /* Hadamard */
        45% { cx: 173px; } /* Rz */
        65% { cx: 250px; } /* CNOT Control */
        80% { cx: 351px; } /* U3 */
        95% { cx: 507px; opacity: 1; } /* Measure */
        100% { cx: 520px; opacity: 0; }
      }

      /* Entanglement Spark (shoots down from Q0 to Q1 at CNOT) */
      @keyframes cnotSpark {
        0%, 60% { y1: 35px; y2: 35px; opacity: 0; }
        65% { opacity: 1; }
        70% { y1: 35px; y2: 90px; opacity: 1; stroke-width: 3px; }
        75%, 100% { y1: 90px; y2: 90px; opacity: 0; }
      }

      /* Gate Flash reactions */
      @keyframes hFlash {
        0%, 20% { stroke: #00f5d4; }
        25%, 32% { stroke: #ffffff; filter: drop-shadow(0 0 8px #00f5d4); }
        38%, 100% { stroke: #00f5d4; }
      }
      @keyframes targetFlash {
        0%, 65% { stroke: #a855f7; }
        70%, 78% { stroke: #ffffff; filter: drop-shadow(0 0 10px #a855f7); }
        85%, 100% { stroke: #a855f7; }
      }

      /* Probability Amplitude Meters */
      @keyframes barBreathing1 { 0%, 100% { width: 98px; } 50% { width: 114px; } }
      @keyframes barBreathing2 { 0%, 100% { width: 55px; } 50% { width: 42px; } }
      @keyframes barBreathing3 { 0%, 100% { width: 44px; } 50% { width: 56px; } }
      @keyframes barBreathing4 { 0%, 100% { width: 70px; } 50% { width: 82px; } }

      .qc-font-v4 { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .p-clock-0 { transform-origin: 38px 35px; animation: phaseSpin0 3s linear infinite; }
      .p-clock-1 { transform-origin: 38px 90px; animation: phaseSpin1 4s linear infinite; }
      .p-clock-2 { transform-origin: 38px 145px; animation: phaseSpin2 2.5s linear infinite; }
      .p-clock-3 { transform-origin: 38px 200px; animation: phaseSpin3 5s linear infinite; }

      .wavepacket { animation: packetRun0 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .cnot-beam { animation: cnotSpark 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .gate-h-trig { animation: hFlash 4.5s infinite; }
      .gate-cnot-trig { animation: targetFlash 4.5s infinite; }

      .amp-1 { animation: barBreathing1 3s ease-in-out infinite; }
      .amp-2 { animation: barBreathing2 3s ease-in-out infinite; }
      .amp-3 { animation: barBreathing3 3s ease-in-out infinite; }
      .amp-4 { animation: barBreathing4 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container Box (Solid Frame) -->
  <rect x="10" y="10" width="900" height="340" rx="16" fill="#080c15" stroke="#1f293d" stroke-width="1.8" />
  <rect x="12" y="12" width="896" height="336" rx="14" fill="url(#qc-grid-v4)" />

  <!-- Corner Reticles -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#00f5d4" stroke-width="2.2" />
  <path d="M 904 32 L 904 16 L 888 16" fill="none" stroke="#00f5d4" stroke-width="2.2" />
  <path d="M 16 328 L 16 344 L 32 344" fill="none" stroke="#00f5d4" stroke-width="2.2" />
  <path d="M 904 328 L 904 344 L 888 344" fill="none" stroke="#00f5d4" stroke-width="2.2" />

  <!-- Header -->
  <g transform="translate(36, 38)">
    <circle cx="8" cy="8" r="5" fill="#00f5d4" filter="url(#qc-glow-c)" />
    <text x="24" y="12" fill="#00f5d4" font-size="11" font-weight="700" letter-spacing="1.5" class="qc-font-v4">
      QUANTUM CIRCUIT EXECUTION // GATE-TRIGGERED STATE PROPAGATION
    </text>
    <text x="848" y="12" fill="#64748b" font-size="10" font-weight="500" letter-spacing="1" class="qc-font-v4" text-anchor="end">
      FIDELITY: 99.98% • WAVE-PACKET ACTIVE
    </text>
  </g>

  <!-- ==================== CIRCUIT AREA (LEFT) ==================== -->
  <g transform="translate(36, 75)">
    <!-- Circuit Substrate Panel -->
    <rect x="0" y="0" width="570" height="235" rx="10" fill="#0b101a" stroke="#192338" stroke-width="1.2" />

    <!-- QUBIT RAIL 0 -->
    <g transform="translate(0, 35)">
      <!-- Phase Dial Clock -->
      <circle cx="38" cy="0" r="9" fill="#090f1c" stroke="#1f2d45" stroke-width="1" />
      <g class="p-clock-0">
        <line x1="38" y1="0" x2="38" y2="-7" stroke="#00f5d4" stroke-width="1.6" />
      </g>
      <text x="14" y="4" fill="#00f5d4" font-size="11" font-weight="700" class="qc-font-v4">q₀</text>

      <!-- Solid Track Line -->
      <line x1="55" y1="0" x2="540" y2="0" stroke="#1e293b" stroke-width="2" />

      <!-- Gates -->
      <!-- H Gate (Flashes on Packet Pass!) -->
      <rect x="80" y="-16" width="32" height="32" rx="6" fill="#132035" stroke="#00f5d4" stroke-width="1.4" class="gate-h-trig" />
      <text x="96" y="5" fill="#00f5d4" font-size="12" font-weight="700" text-anchor="middle" class="qc-font-v4">H</text>

      <!-- Rz(θ) Gate -->
      <rect x="150" y="-16" width="46" height="32" rx="6" fill="#0e1e33" stroke="#00e5ff" stroke-width="1.3" />
      <text x="173" y="5" fill="#00e5ff" font-size="10" font-weight="700" text-anchor="middle" class="qc-font-v4">Rz(&#952;)</text>

      <!-- Control Node CNOT -->
      <circle cx="250" cy="0" r="5.5" fill="#a855f7" filter="url(#qc-glow-v)" />

      <!-- U3 Gate -->
      <rect x="330" y="-16" width="42" height="32" rx="6" fill="#1e1335" stroke="#ec4899" stroke-width="1.3" />
      <text x="351" y="5" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle" class="qc-font-v4">U&#8323;</text>

      <!-- Measurement [M] -->
      <rect x="490" y="-16" width="34" height="32" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.2" />
      <path d="M 498 8 A 9 9 0 0 1 516 8 M 507 8 L 514 -3" fill="none" stroke="#94a3b8" stroke-width="1.4" />

      <!-- Moving Quantum Wavepacket! -->
      <circle cx="55" cy="0" r="4.5" fill="#ffffff" class="wavepacket" filter="url(#qc-glow-c)" />
    </g>

    <!-- Vertical Entangling Electric Spark (Shoots Down from Q0 to Q1 at CNOT!) -->
    <line x1="250" y1="35" x2="250" y2="90" stroke="#1e293b" stroke-width="2" />
    <line x1="250" y1="35" x2="250" y2="35" stroke="#a855f7" stroke-width="2.5" class="cnot-beam" filter="url(#qc-glow-v)" />

    <!-- QUBIT RAIL 1 -->
    <g transform="translate(0, 90)">
      <circle cx="38" cy="0" r="9" fill="#090f1c" stroke="#1f2d45" stroke-width="1" />
      <g class="p-clock-1">
        <line x1="38" y1="0" x2="38" y2="-7" stroke="#00e5ff" stroke-width="1.6" />
      </g>
      <text x="14" y="4" fill="#00e5ff" font-size="11" font-weight="700" class="qc-font-v4">q₁</text>

      <line x1="55" y1="0" x2="540" y2="0" stroke="#1e293b" stroke-width="2" />

      <!-- Target Node CNOT (Flashes on Spark Hit!) -->
      <circle cx="250" cy="0" r="10" fill="#15122b" stroke="#a855f7" stroke-width="1.8" class="gate-cnot-trig" />
      <path d="M 250 -10 L 250 10 M 240 0 L 260 0" stroke="#a855f7" stroke-width="1.8" />

      <!-- Rx Gate -->
      <rect x="330" y="-16" width="42" height="32" rx="6" fill="#181e35" stroke="#38bdf8" stroke-width="1.3" />
      <text x="351" y="5" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" class="qc-font-v4">Rx</text>

      <!-- Ry Gate -->
      <rect x="410" y="-16" width="42" height="32" rx="6" fill="#2d1d15" stroke="#f59e0b" stroke-width="1.3" />
      <text x="431" y="5" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle" class="qc-font-v4">Ry</text>

      <!-- Measure -->
      <rect x="490" y="-16" width="34" height="32" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.2" />
      <path d="M 498 8 A 9 9 0 0 1 516 8 M 507 8 L 514 -3" fill="none" stroke="#94a3b8" stroke-width="1.4" />
    </g>

    <!-- QUBIT RAIL 2 -->
    <g transform="translate(0, 145)">
      <circle cx="38" cy="0" r="9" fill="#090f1c" stroke="#1f2d45" stroke-width="1" />
      <g class="p-clock-2">
        <line x1="38" y1="0" x2="38" y2="-7" stroke="#a855f7" stroke-width="1.6" />
      </g>
      <text x="14" y="4" fill="#a855f7" font-size="11" font-weight="700" class="qc-font-v4">q₂</text>

      <line x1="55" y1="0" x2="540" y2="0" stroke="#1e293b" stroke-width="2" />

      <!-- H Gate -->
      <rect x="80" y="-16" width="32" height="32" rx="6" fill="#132035" stroke="#00f5d4" stroke-width="1.4" />
      <text x="96" y="5" fill="#00f5d4" font-size="12" font-weight="700" text-anchor="middle" class="qc-font-v4">H</text>

      <!-- Control Node CZ -->
      <circle cx="170" cy="0" r="5.5" fill="#00e5ff" filter="url(#qc-glow-c)" />

      <!-- S Gate -->
      <rect x="250" y="-16" width="34" height="32" rx="6" fill="#1e1835" stroke="#c084fc" stroke-width="1.3" />
      <text x="267" y="5" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle" class="qc-font-v4">S</text>

      <!-- Measure -->
      <rect x="490" y="-16" width="34" height="32" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.2" />
      <path d="M 498 8 A 9 9 0 0 1 516 8 M 507 8 L 514 -3" fill="none" stroke="#94a3b8" stroke-width="1.4" />
    </g>

    <!-- CZ Bus Line -->
    <line x1="170" y1="145" x2="170" y2="200" stroke="#00e5ff" stroke-width="1.8" stroke-dasharray="3 3" />

    <!-- QUBIT RAIL 3 -->
    <g transform="translate(0, 200)">
      <circle cx="38" cy="0" r="9" fill="#090f1c" stroke="#1f2d45" stroke-width="1" />
      <g class="p-clock-3">
        <line x1="38" y1="0" x2="38" y2="-7" stroke="#f59e0b" stroke-width="1.6" />
      </g>
      <text x="14" y="4" fill="#f59e0b" font-size="11" font-weight="700" class="qc-font-v4">q₃</text>

      <line x1="55" y1="0" x2="540" y2="0" stroke="#1e293b" stroke-width="2" />

      <!-- Target CZ -->
      <circle cx="170" cy="0" r="5.5" fill="#00e5ff" filter="url(#qc-glow-c)" />

      <!-- T Gate -->
      <rect x="250" y="-16" width="34" height="32" rx="6" fill="#2d2215" stroke="#f59e0b" stroke-width="1.3" />
      <text x="267" y="5" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle" class="qc-font-v4">T</text>

      <!-- Adaptive Synthesis Block -->
      <rect x="330" y="-16" width="122" height="32" rx="6" fill="#10252b" stroke="#10b981" stroke-width="1.3" />
      <text x="391" y="5" fill="#10b981" font-size="10.5" font-weight="700" text-anchor="middle" class="qc-font-v4">ADAPT_SYNTH</text>

      <!-- Measure -->
      <rect x="490" y="-16" width="34" height="32" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.2" />
      <path d="M 498 8 A 9 9 0 0 1 516 8 M 507 8 L 514 -3" fill="none" stroke="#94a3b8" stroke-width="1.4" />
    </g>
  </g>

  <!-- ==================== STATEVECTOR TELEMETRY (RIGHT) ==================== -->
  <g transform="translate(626, 75)">
    <!-- Container -->
    <rect x="0" y="0" width="258" height="235" rx="10" fill="#0b101a" stroke="#192338" stroke-width="1.2" />

    <!-- Title -->
    <text x="16" y="24" fill="#00f5d4" font-size="11" font-weight="700" letter-spacing="1" class="qc-font-v4">
      STATE PROBABILITIES
    </text>

    <!-- State |0000> -->
    <g transform="translate(16, 48)">
      <text x="0" y="10" fill="#94a3b8" font-size="10.5" font-weight="600" class="qc-font-v4">|0000&#10217;</text>
      <rect x="54" y="1" width="160" height="12" rx="3" fill="#161f30" />
      <rect x="54" y="1" width="105" height="12" rx="3" fill="#00f5d4" class="amp-1" filter="url(#qc-glow-c)" />
      <text x="170" y="10" fill="#00f5d4" font-size="9.5" font-weight="700" class="qc-font-v4">48.2%</text>
    </g>

    <!-- State |0101> -->
    <g transform="translate(16, 78)">
      <text x="0" y="10" fill="#94a3b8" font-size="10.5" font-weight="600" class="qc-font-v4">|0101&#10217;</text>
      <rect x="54" y="1" width="160" height="12" rx="3" fill="#161f30" />
      <rect x="54" y="1" width="62" height="12" rx="3" fill="#00e5ff" class="amp-2" />
      <text x="170" y="10" fill="#00e5ff" font-size="9.5" font-weight="700" class="qc-font-v4">18.5%</text>
    </g>

    <!-- State |1010> -->
    <g transform="translate(16, 108)">
      <text x="0" y="10" fill="#94a3b8" font-size="10.5" font-weight="600" class="qc-font-v4">|1010&#10217;</text>
      <rect x="54" y="1" width="160" height="12" rx="3" fill="#161f30" />
      <rect x="54" y="1" width="48" height="12" rx="3" fill="#a855f7" class="amp-3" />
      <text x="170" y="10" fill="#a855f7" font-size="9.5" font-weight="700" class="qc-font-v4">14.1%</text>
    </g>

    <!-- State |1111> -->
    <g transform="translate(16, 138)">
      <text x="0" y="10" fill="#94a3b8" font-size="10.5" font-weight="600" class="qc-font-v4">|1111&#10217;</text>
      <rect x="54" y="1" width="160" height="12" rx="3" fill="#161f30" />
      <rect x="54" y="1" width="72" height="12" rx="3" fill="#ec4899" class="amp-4" />
      <text x="170" y="10" fill="#ec4899" font-size="9.5" font-weight="700" class="qc-font-v4">19.2%</text>
    </g>

    <line x1="16" y1="168" x2="242" y2="168" stroke="#1e293b" stroke-width="1" />

    <!-- Metrics -->
    <text x="16" y="188" fill="#64748b" font-size="10" class="qc-font-v4">ENTANGLEMENT: <tspan fill="#38bdf8">1.382</tspan></text>
    <text x="16" y="206" fill="#64748b" font-size="10" class="qc-font-v4">STATE PURITY: <tspan fill="#00f5d4">0.9994</tspan></text>
    <text x="16" y="224" fill="#64748b" font-size="10" class="qc-font-v4">ANSATZ DEPTH: <tspan fill="#f59e0b">O(log N)</tspan></text>
  </g>

  <!-- Bottom Telemetry Footer Strip -->
  <g transform="translate(36, 332)">
    <text x="0" y="0" fill="#475569" font-size="10.5" class="qc-font-v4">
      QUANTUM SUBSTRATE: TRANSMON LATTICES • QUANTUM ANNEALING • GPU ACCELERATION
    </text>
    <text x="848" y="0" fill="#00f5d4" font-size="10.5" font-weight="700" text-anchor="end" class="qc-font-v4">
      &#9670; SYNTHESIS PIPELINE ACTIVE
    </text>
  </g>
</svg>
