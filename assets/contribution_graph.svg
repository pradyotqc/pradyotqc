<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="cg-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#131c2e" stroke-width="0.75" opacity="0.6" />
      <circle cx="24" cy="0" r="1.1" fill="#22d3ee" opacity="0.25" />
    </pattern>

    <!-- Area Gradient (Cyan / Sky-Blue) -->
    <linearGradient id="cg-area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </linearGradient>

    <!-- Area Gradient Secondary (Violet / Purple) -->
    <linearGradient id="cg-area-grad-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Line Gradient -->
    <linearGradient id="cg-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cg-glow-intense" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .cg-font {
        font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', 'Liberation Mono', monospace;
      }

      /* Animated Spline Drawing and Pulse */
      @keyframes lineDrawAnimation {
        0% { stroke-dashoffset: 2400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes linePulseGlow {
        0%, 100% { filter: drop-shadow(0 0 2px #22d3ee); opacity: 0.9; }
        50% { filter: drop-shadow(0 0 8px #22d3ee); opacity: 1; }
      }
      .cg-main-line {
        stroke-dasharray: 2400;
        animation: lineDrawAnimation 4s ease-out forwards, linePulseGlow 3s ease-in-out infinite 4s;
      }

      /* Scanning Vertical Laser Cursor */
      @keyframes laserCursorSweep {
        0% { transform: translateX(80px); opacity: 0; }
        5% { opacity: 1; }
        95% { opacity: 1; }
        100% { transform: translateX(860px); opacity: 0; }
      }
      .cg-scanner-bar {
        animation: laserCursorSweep 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Pulsating Peak Halos */
      @keyframes peakRippleEffect {
        0% { r: 4px; opacity: 1; }
        100% { r: 14px; opacity: 0; }
      }
      @keyframes peakBlinkCenter {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.6; }
      }
      .cg-ripple-1 { animation: peakRippleEffect 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite; }
      .cg-ripple-2 { animation: peakRippleEffect 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 0.7s; }
      .cg-ripple-3 { animation: peakRippleEffect 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 1.4s; }

      /* Area Fill Breathing */
      @keyframes areaBreath {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 0.95; }
      }
      .cg-area {
        animation: areaBreath 4s ease-in-out infinite;
      }

      /* Header Status Blink */
      @keyframes beaconFastBlink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #22d3ee); }
        50% { opacity: 0.2; }
      }
      .cg-beacon {
        animation: beaconFastBlink 1.2s ease-in-out infinite;
      }

      /* Traveling Comet on Graph Curve */
      @keyframes cometAlongGraph {
        0% { offset-distance: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="900" height="360" rx="14" fill="#060911" stroke="#1e293b" stroke-width="1.6" />
  <rect x="12" y="12" width="896" height="356" rx="12" fill="url(#cg-grid)" />

  <!-- Corner Brackets -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 904 32 L 904 16 L 888 16" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 16 348 L 16 364 L 32 364" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 904 348 L 904 364 L 888 364" fill="none" stroke="#22d3ee" stroke-width="2.2" />

  <!-- ==================== HEADER BAR ==================== -->
  <g transform="translate(36, 38)">
    <circle cx="8" cy="8" r="5" fill="#22d3ee" class="cg-beacon" filter="url(#cg-glow)" />
    <text x="24" y="12" fill="#22d3ee" font-size="12" font-weight="700" letter-spacing="1.5" class="cg-font">
      PRADYOT_QC // CONTRIBUTION GRAPH &amp; ACTIVITY FLUX
    </text>

    <!-- 351 Total Contributions Pill Badge -->
    <g transform="translate(480, -4)">
      <rect x="0" y="0" width="200" height="24" rx="6" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#22d3ee" class="cg-beacon" />
      <text x="105" y="16" fill="#22d3ee" font-size="10.5" font-weight="800" text-anchor="middle" class="cg-font">
        351 TOTAL CONTRIBUTIONS
      </text>
    </g>

    <!-- Epoch Pill Badge -->
    <g transform="translate(692, -4)">
      <rect x="0" y="0" width="160" height="24" rx="6" fill="#0e1a2d" stroke="#1f3758" stroke-width="1" />
      <text x="80" y="16" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" class="cg-font">
        APR 4, 2024 – PRESENT
      </text>
    </g>
  </g>

  <!-- ==================== GRAPH SUBSTRATE ==================== -->
  <g transform="translate(36, 75)">
    <!-- Inner Graph Background Plate -->
    <rect x="0" y="0" width="848" height="235" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" />

    <!-- Y-Axis Commit Level Scale -->
    <g transform="translate(35, 0)">
      <text x="-12" y="45" fill="#475569" font-size="9" text-anchor="end" class="cg-font">25</text>
      <text x="-12" y="85" fill="#475569" font-size="9" text-anchor="end" class="cg-font">20</text>
      <text x="-12" y="125" fill="#475569" font-size="9" text-anchor="end" class="cg-font">15</text>
      <text x="-12" y="165" fill="#475569" font-size="9" text-anchor="end" class="cg-font">10</text>
      <text x="-12" y="205" fill="#475569" font-size="9" text-anchor="end" class="cg-font">0</text>

      <!-- Horizontal Grid Lines -->
      <line x1="0" y1="42" x2="800" y2="42" stroke="#162032" stroke-width="0.8" stroke-dasharray="3 3" />
      <line x1="0" y1="82" x2="800" y2="82" stroke="#162032" stroke-width="0.8" stroke-dasharray="3 3" />
      <line x1="0" y1="122" x2="800" y2="122" stroke="#162032" stroke-width="0.8" stroke-dasharray="3 3" />
      <line x1="0" y1="162" x2="800" y2="162" stroke="#162032" stroke-width="0.8" stroke-dasharray="3 3" />
      <line x1="0" y1="202" x2="800" y2="202" stroke="#1e293b" stroke-width="1.2" />
    </g>

    <!-- Secondary Ghost Curve (Purple/Violet Algorithmic R&D Stream) -->
    <path d="M 40 202 Q 100 175, 140 185 T 220 160 T 300 145 T 380 170 T 460 115 T 540 155 T 620 95 T 700 130 T 780 85 L 835 110 L 835 202 L 40 202 Z" fill="url(#cg-area-grad-purple)" class="cg-area" opacity="0.6" />
    <path d="M 40 202 Q 100 175, 140 185 T 220 160 T 300 145 T 380 170 T 460 115 T 540 155 T 620 95 T 700 130 T 780 85 L 835 110" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.75" />

    <!-- Primary Contribution Area Under Curve (Cyan Gradient) -->
    <path d="M 40 202 Q 100 160, 140 172 T 220 140 T 300 120 T 380 150 T 460 90 T 540 130 T 620 70 T 700 105 T 780 60 L 835 90 L 835 202 L 40 202 Z" fill="url(#cg-area-grad)" class="cg-area" />

    <!-- Primary Animated Spline Curve (Cyan Glowing Neon Line) -->
    <path d="M 40 202 Q 100 160, 140 172 T 220 140 T 300 120 T 380 150 T 460 90 T 540 130 T 620 70 T 700 105 T 780 60 L 835 90" fill="none" stroke="url(#cg-line-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="cg-main-line" filter="url(#cg-glow)" />

    <!-- Peak Markers with Pulsating Rings -->
    <!-- Peak 1: May/June 2024 -->
    <g transform="translate(300, 120)">
      <circle cx="0" cy="0" r="4" fill="#none" stroke="#22d3ee" stroke-width="1.5" class="cg-ripple-1" />
      <circle cx="0" cy="0" r="4" fill="#22d3ee" filter="url(#cg-glow)" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>

    <!-- Peak 2: Nov 2024 -->
    <g transform="translate(460, 90)">
      <circle cx="0" cy="0" r="4" fill="#none" stroke="#38bdf8" stroke-width="1.5" class="cg-ripple-2" />
      <circle cx="0" cy="0" r="4.5" fill="#38bdf8" filter="url(#cg-glow-intense)" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
      <!-- Peak Callout Tag -->
      <rect x="-38" y="-24" width="76" height="18" rx="4" fill="#0b1626" stroke="#38bdf8" stroke-width="0.8" />
      <text x="0" y="-12" fill="#38bdf8" font-size="8.5" font-weight="700" text-anchor="middle" class="cg-font">+18 COMMITS</text>
    </g>

    <!-- Peak 3: March 2025 -->
    <g transform="translate(620, 70)">
      <circle cx="0" cy="0" r="4" fill="#none" stroke="#38bdf8" stroke-width="1.5" class="cg-ripple-3" />
      <circle cx="0" cy="0" r="4.5" fill="#38bdf8" filter="url(#cg-glow-intense)" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
      <rect x="-38" y="-24" width="76" height="18" rx="4" fill="#0b1626" stroke="#38bdf8" stroke-width="0.8" />
      <text x="0" y="-12" fill="#38bdf8" font-size="8.5" font-weight="700" text-anchor="middle" class="cg-font">+24 COMMITS</text>
    </g>

    <!-- Peak 4: Recent Surge (Present Epoch) -->
    <g transform="translate(780, 60)">
      <circle cx="0" cy="0" r="4" fill="#none" stroke="#22d3ee" stroke-width="1.5" class="cg-ripple-1" />
      <circle cx="0" cy="0" r="5" fill="#22d3ee" filter="url(#cg-glow-intense)" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
      <rect x="-42" y="-24" width="84" height="18" rx="4" fill="#091b22" stroke="#22d3ee" stroke-width="0.9" />
      <text x="0" y="-12" fill="#22d3ee" font-size="8.5" font-weight="700" text-anchor="middle" class="cg-font">SURGE: +32</text>
    </g>

    <!-- ==================== ANIMATED SCANNING LASER CURSOR ==================== -->
    <g class="cg-scanner-bar">
      <!-- Vertical Laser Scanning Line -->
      <line x1="0" y1="20" x2="0" y2="202" stroke="#22d3ee" stroke-width="1.8" filter="url(#cg-glow)" opacity="0.85" />
      <line x1="0" y1="20" x2="0" y2="202" stroke="#ffffff" stroke-width="0.8" opacity="0.95" />
      <!-- Top and Bottom Reticle Crosshair Pointers -->
      <polygon points="0,20 -4,14 4,14" fill="#22d3ee" />
      <polygon points="0,202 -4,208 4,208" fill="#22d3ee" />
    </g>

    <!-- X-Axis Timeline Month Labels -->
    <g transform="translate(0, 222)">
      <text x="40" y="0" fill="#64748b" font-size="8.5" font-weight="600" class="cg-font">APR '24</text>
      <text x="140" y="0" fill="#64748b" font-size="8.5" font-weight="600" class="cg-font">JUN '24</text>
      <text x="240" y="0" fill="#64748b" font-size="8.5" font-weight="600" class="cg-font">AUG '24</text>
      <text x="340" y="0" fill="#64748b" font-size="8.5" font-weight="600" class="cg-font">OCT '24</text>
      <text x="440" y="0" fill="#64748b" font-size="8.5" font-weight="600" class="cg-font">DEC '24</text>
      <text x="540" y="0" fill="#64748b" font-size="8.5" font-weight="600" class="cg-font">FEB '25</text>
      <text x="640" y="0" fill="#64748b" font-size="8.5" font-weight="600" class="cg-font">APR '25</text>
      <text x="740" y="0" fill="#64748b" font-size="8.5" font-weight="600" class="cg-font">AUG '25</text>
      <text x="815" y="0" fill="#22d3ee" font-size="8.5" font-weight="700" class="cg-font">PRESENT</text>
    </g>
  </g>

  <!-- ==================== BOTTOM TELEMETRY FOOTER ==================== -->
  <g transform="translate(36, 345)">
    <circle cx="0" cy="-3" r="3" fill="#22d3ee" class="cg-beacon" />
    <text x="12" y="0" fill="#64748b" font-size="10" font-weight="600" class="cg-font">
      CONTRIBUTION HARVEST: 351 TOTAL COMMITS • 100% PERSISTENT UPTIME
    </text>
    <text x="848" y="0" fill="#22d3ee" font-size="10" font-weight="700" letter-spacing="1" class="cg-font" text-anchor="end">
      VELOCITY: EXPONENTIAL CADENCE ➔
    </text>
  </g>
</svg>
