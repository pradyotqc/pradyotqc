<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <pattern id="csc-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#131c2e" stroke-width="0.75" opacity="0.6" />
      <circle cx="22" cy="0" r="1.1" fill="#22d3ee" opacity="0.25" />
    </pattern>

    <filter id="csc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .csc-font { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }

      @keyframes cscPulseRow1 {
        0%, 100% { border-color: #1e293b; }
        33% { stroke: #22d3ee; filter: drop-shadow(0 0 6px #22d3ee); }
      }
      @keyframes cscPulseRow2 {
        0%, 33% { border-color: #1e293b; }
        66% { stroke: #818cf8; filter: drop-shadow(0 0 6px #818cf8); }
      }
      @keyframes cscPulseRow3 {
        0%, 66% { border-color: #1e293b; }
        100% { stroke: #38bdf8; filter: drop-shadow(0 0 6px #38bdf8); }
      }

      .csc-card-1 { animation: cscPulseRow1 5s infinite; }
      .csc-card-2 { animation: cscPulseRow2 5s infinite; }
      .csc-card-3 { animation: cscPulseRow3 5s infinite; }

      @keyframes cscBeaconBlink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #22d3ee); }
        50% { opacity: 0.3; }
      }
      .csc-beacon { animation: cscBeaconBlink 1.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="900" height="200" rx="14" fill="#060911" stroke="#1e293b" stroke-width="1.6" />
  <rect x="12" y="12" width="896" height="196" rx="12" fill="url(#csc-grid)" />

  <!-- Corner Brackets -->
  <path d="M 16 30 L 16 16 L 30 16" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 904 30 L 904 16 L 890 16" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 16 190 L 16 204 L 30 204" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 904 190 L 904 204 L 890 204" fill="none" stroke="#22d3ee" stroke-width="2.2" />

  <!-- ==================== 3 GLOWING CIRCUIT CARDS ==================== -->

  <!-- ROW 1: GATE SYNTHESIS -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="872" height="52" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" class="csc-card-1" />
    <rect x="0" y="0" width="4" height="52" rx="2" fill="#22d3ee" />
    <circle cx="20" cy="18" r="4" fill="#22d3ee" class="csc-beacon" />
    <text x="34" y="22" fill="#22d3ee" font-size="12" font-weight="800" class="csc-font">
      ⚛️ GATE SYNTHESIS &amp; COMMUTATION
    </text>
    <text x="34" y="40" fill="#cbd5e1" font-size="11" font-weight="400" class="csc-font">
      Compressing deep circuits into hardware-native unitary representations with minimal two-qubit gate counts.
    </text>
  </g>

  <!-- ROW 2: COHERENCE & NOISE MITIGATION -->
  <g transform="translate(24, 82)">
    <rect x="0" y="0" width="872" height="52" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" class="csc-card-2" />
    <rect x="0" y="0" width="4" height="52" rx="2" fill="#818cf8" />
    <circle cx="20" cy="18" r="4" fill="#818cf8" class="csc-beacon" />
    <text x="34" y="22" fill="#a78bfa" font-size="12" font-weight="800" class="csc-font">
      🛡️ COHERENCE &amp; NOISE MITIGATION
    </text>
    <text x="34" y="40" fill="#cbd5e1" font-size="11" font-weight="400" class="csc-font">
      Dynamically decoupled pulse sequencing and zero-noise extrapolation for high-fidelity state preparation.
    </text>
  </g>

  <!-- ROW 3: STATEVECTOR AMPLITUDE PROFILING -->
  <g transform="translate(24, 142)">
    <rect x="0" y="0" width="872" height="52" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" class="csc-card-3" />
    <rect x="0" y="0" width="4" height="52" rx="2" fill="#38bdf8" />
    <circle cx="20" cy="18" r="4" fill="#38bdf8" class="csc-beacon" />
    <text x="34" y="22" fill="#38bdf8" font-size="12" font-weight="800" class="csc-font">
      📊 STATEVECTOR AMPLITUDE PROFILING
    </text>
    <text x="34" y="40" fill="#cbd5e1" font-size="11" font-weight="400" class="csc-font">
      GPU-accelerated contraction and tensor-network verification across high-dimensional Hilbert spaces.
    </text>
  </g>
</svg>
