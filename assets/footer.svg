<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 100" width="100%" height="100%">
  <defs>
    <pattern id="ftr-grid-v3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#131c2e" stroke-width="0.7" opacity="0.6" />
    </pattern>

    <filter id="ftr-glow-v3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .ftr-font-v3 {
        font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', 'Liberation Mono', monospace;
      }
      @keyframes ftrPulseGlowV3 {
        0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 2px #22d3ee); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #22d3ee); }
      }
      @keyframes solitonPacketMoveV3 {
        0% { transform: translateX(25px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(875px); opacity: 0; }
      }
      @keyframes beaconBlinkV3 {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #22d3ee); }
        50% { opacity: 0.3; }
      }
      .ftr-glow-center {
        animation: ftrPulseGlowV3 3s ease-in-out infinite;
      }
      .soliton-packet-v3 {
        animation: solitonPacketMoveV3 3.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .beacon-ind-v3 {
        animation: beaconBlinkV3 1.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="900" height="80" rx="14" fill="#060911" stroke="#1e293b" stroke-width="1.6" />
  <rect x="12" y="12" width="896" height="76" rx="12" fill="url(#ftr-grid-v3)" />

  <!-- Corner Brackets -->
  <path d="M 16 26 L 16 16 L 26 16" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 904 26 L 904 16 L 894 16" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 16 74 L 16 84 L 26 84" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 904 74 L 904 84 L 894 84" fill="none" stroke="#22d3ee" stroke-width="2.2" />

  <!-- Top Soliton Optical Bus Track -->
  <line x1="30" y1="22" x2="890" y2="22" stroke="#141d2e" stroke-width="2" />
  <line x1="30" y1="22" x2="890" y2="22" stroke="#1e293b" stroke-width="1" />

  <!-- Soliton Wavepacket Pulse Traveling Along the Bus -->
  <g class="soliton-packet-v3">
    <ellipse cx="0" cy="22" rx="16" ry="3.5" fill="#22d3ee" filter="url(#ftr-glow-v3)" />
    <circle cx="0" cy="22" r="2" fill="#ffffff" />
  </g>

  <!-- Center Primary Title (Dedicated Middle Row - Zero Horizontal Overlap) -->
  <g transform="translate(460, 48)" text-anchor="middle">
    <text x="0" y="0" fill="#22d3ee" font-size="12" font-weight="700" letter-spacing="2" class="ftr-font-v3 ftr-glow-center">
      ◆ TRANSMISSION SECURE // ALGORITHM–HARDWARE CO-DESIGN ◆
    </text>
  </g>

  <!-- Bottom Distributed Telemetry Row (Spacious 3-Way Grid) -->
  <!-- Left Telemetry Node -->
  <g transform="translate(36, 72)">
    <circle cx="0" cy="-3.5" r="3" fill="#22d3ee" class="beacon-ind-v3" />
    <text x="12" y="0" fill="#64748b" font-size="9.5" font-weight="600" class="ftr-font-v3">
      [ RUNTIME: PERSISTENT • SYNCHRONIZED ]
    </text>
  </g>

  <!-- Center Telemetry Node -->
  <g transform="translate(460, 72)" text-anchor="middle">
    <text x="0" y="0" fill="#475569" font-size="9" font-weight="500" letter-spacing="1.2" class="ftr-font-v3">
      PRADYOT_QC.KERNEL • COHERENCE ENGINE STABLE
    </text>
  </g>

  <!-- Right Telemetry Node -->
  <g transform="translate(884, 72)" text-anchor="end">
    <circle cx="-242" cy="-3.5" r="3" fill="#818cf8" class="beacon-ind-v3" />
    <text x="0" y="0" fill="#64748b" font-size="9.5" font-weight="600" class="ftr-font-v3">
      [ COHERENCE: LOCKED • FIDELITY: 99.98% ]
    </text>
  </g>
</svg>
