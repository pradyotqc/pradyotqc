<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="esc-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#131c2e" stroke-width="0.75" opacity="0.6" />
      <circle cx="22" cy="0" r="1.1" fill="#22d3ee" opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="esc-glow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .esc-font { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }

      @keyframes escPulseRow1 {
        0%, 100% { border-color: #1e293b; }
        20% { stroke: #22d3ee; filter: drop-shadow(0 0 6px #22d3ee); }
      }
      @keyframes escPulseRow2 {
        0%, 20% { border-color: #1e293b; }
        40% { stroke: #38bdf8; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes escPulseRow3 {
        0%, 40% { border-color: #1e293b; }
        60% { stroke: #818cf8; filter: drop-shadow(0 0 6px #818cf8); }
      }
      @keyframes escPulseRow4 {
        0%, 60% { border-color: #1e293b; }
        80% { stroke: #f472b6; filter: drop-shadow(0 0 6px #f472b6); }
      }
      @keyframes escPulseRow5 {
        0%, 80% { border-color: #1e293b; }
        100% { stroke: #34d399; filter: drop-shadow(0 0 6px #34d399); }
      }

      .esc-card-1 { animation: escPulseRow1 6s infinite; }
      .esc-card-2 { animation: escPulseRow2 6s infinite; }
      .esc-card-3 { animation: escPulseRow3 6s infinite; }
      .esc-card-4 { animation: escPulseRow4 6s infinite; }
      .esc-card-5 { animation: escPulseRow5 6s infinite; }

      @keyframes escBeaconBlink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #22d3ee); }
        50% { opacity: 0.3; }
      }
      .esc-beacon { animation: escBeaconBlink 1.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="900" height="350" rx="14" fill="#060911" stroke="#1e293b" stroke-width="1.6" />
  <rect x="12" y="12" width="896" height="346" rx="12" fill="url(#esc-grid)" />

  <!-- Corner Brackets -->
  <path d="M 16 30 L 16 16 L 30 16" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 904 30 L 904 16 L 890 16" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 16 340 L 16 354 L 30 354" fill="none" stroke="#22d3ee" stroke-width="2.2" />
  <path d="M 904 340 L 904 354 L 890 354" fill="none" stroke="#22d3ee" stroke-width="2.2" />

  <!-- ==================== 5 GLOWING EXECUTION STACK CARDS ==================== -->

  <!-- ROW 1: 01 // HAMILTONIAN MAPPING -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="872" height="56" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" class="esc-card-1" />
    <rect x="0" y="0" width="4" height="56" rx="2" fill="#22d3ee" />
    <circle cx="20" cy="20" r="4" fill="#22d3ee" class="esc-beacon" />
    <text x="34" y="24" fill="#22d3ee" font-size="12" font-weight="800" class="esc-font">
      🔬 01 // HAMILTONIAN SPECIFICATION &amp; ORBITAL MAPPING
    </text>
    <text x="34" y="44" fill="#cbd5e1" font-size="11" font-weight="400" class="esc-font">
      Fermion-to-qubit mappings (Jordan-Wigner, Bravyi-Kitaev, Parity), SparsePauliOp compression, and QSCI configurations.
    </text>
  </g>

  <!-- ROW 2: 02 // ALGORITHMIC STATE DYNAMICS -->
  <g transform="translate(24, 88)">
    <rect x="0" y="0" width="872" height="56" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" class="esc-card-2" />
    <rect x="0" y="0" width="4" height="56" rx="2" fill="#38bdf8" />
    <circle cx="20" cy="20" r="4" fill="#38bdf8" class="esc-beacon" />
    <text x="34" y="24" fill="#38bdf8" font-size="12" font-weight="800" class="esc-font">
      🧬 02 // ALGORITHMIC ANSATZ &amp; STATE EVOLUTION DYNAMICS
    </text>
    <text x="34" y="44" fill="#cbd5e1" font-size="11" font-weight="400" class="esc-font">
      Adaptive circuit synthesis (ADAPT-VQE), advanced reverse annealing schedules (RQA), and Krylov subspace expansion methods.
    </text>
  </g>

  <!-- ROW 3: 03 // TRANSPILER OPTIMIZATION PASSES -->
  <g transform="translate(24, 152)">
    <rect x="0" y="0" width="872" height="56" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" class="esc-card-3" />
    <rect x="0" y="0" width="4" height="56" rx="2" fill="#818cf8" />
    <circle cx="20" cy="20" r="4" fill="#818cf8" class="esc-beacon" />
    <text x="34" y="24" fill="#a78bfa" font-size="12" font-weight="800" class="esc-font">
      🎛️ 03 // COMPILER SYNTHESIS &amp; CIRCUIT TRANSPILATION PASSES
    </text>
    <text x="34" y="44" fill="#cbd5e1" font-size="11" font-weight="400" class="esc-font">
      Commutation-based DAG rewriting, connectivity-aware routing, pulse synthesis, and gate-error sensitivity profiling.
    </text>
  </g>

  <!-- ROW 4: 04 // PULSE-LEVEL CONTROL -->
  <g transform="translate(24, 216)">
    <rect x="0" y="0" width="872" height="56" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" class="esc-card-4" />
    <rect x="0" y="0" width="4" height="56" rx="2" fill="#f472b6" />
    <circle cx="20" cy="20" r="4" fill="#f472b6" class="esc-beacon" />
    <text x="34" y="24" fill="#f472b6" font-size="12" font-weight="800" class="esc-font">
      ⚡ 04 // PULSE-LEVEL SCHEDULING &amp; DRIVER CONTROL
    </text>
    <text x="34" y="44" fill="#cbd5e1" font-size="11" font-weight="400" class="esc-font">
      Custom OpenPulse Hamiltonian shaping, dynamical decoupling sequences (XY4, CPMG), and crosstalk suppression.
    </text>
  </g>

  <!-- ROW 5: 05 // HYBRID HARDWARE & HPC BACKENDS -->
  <g transform="translate(24, 280)">
    <rect x="0" y="0" width="872" height="56" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" class="esc-card-5" />
    <rect x="0" y="0" width="4" height="56" rx="2" fill="#34d399" />
    <circle cx="20" cy="20" r="4" fill="#34d399" class="esc-beacon" />
    <text x="34" y="24" fill="#34d399" font-size="12" font-weight="800" class="esc-font">
      🚀 05 // HYBRID HARDWARE EXECUTION &amp; GPU TENSOR EMULATION
    </text>
    <text x="34" y="44" fill="#cbd5e1" font-size="11" font-weight="400" class="esc-font">
      Real-device execution across superconducting transmon lattices, analog quantum processors, and GPU tensor emulation.
    </text>
  </g>
</svg>
